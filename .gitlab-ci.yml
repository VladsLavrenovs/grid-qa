stages:
  - lint
  - test
  - publish

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - ruff check libraries/ scripts/
    - ruff format --check libraries/ scripts/
    - robot --dryrun tests/

robot-tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - robot --outputdir results --xunit xunit.xml tests/ || RESULT=$?
    - rebot --nostatusrc --outputdir public --log NONE --report report.html results/output.xml
    - python scripts/make_index.py
    - exit ${RESULT:-0}
  artifacts:
    when: always
    paths:
      - results/
      - public/
    reports:
      junit: results/xunit.xml
    access: developer   # results/log.html holds request data - project members only
    expire_in: 7 days

publish:
  stage: publish
  image: node:20-slim
  needs: [robot-tests]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  script:
    - npx --yes wrangler pages project create grid-qa --production-branch=main || true
    - npx --yes wrangler pages deploy public --project-name=grid-qa

